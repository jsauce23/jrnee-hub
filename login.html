<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>JRNEE Website Hub · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:#0A1224;background:#F6F8FC;
  display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 30% 30% at 30% 35%,rgba(6,182,212,.20),transparent 70%),
    radial-gradient(ellipse 32% 32% at 70% 30%,rgba(124,92,255,.18),transparent 70%),
    radial-gradient(ellipse 36% 34% at 50% 60%,rgba(18,87,255,.16),transparent 72%);
}
.card{
  width:100%;max-width:400px;background:#fff;border:1px solid #E3E8F2;border-radius:22px;padding:34px 30px 30px;
  box-shadow:0 30px 70px -40px rgba(10,18,36,.45);position:relative;overflow:hidden;
}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,#22D3EE,#1257FF,#FBBF24,#34D399,#7C5CFF,#FF4D8D)}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.04em}
.brand b i{font-style:normal;color:#1257FF}
.k{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#1257FF;margin-top:26px}
h1{font-size:25px;font-weight:800;letter-spacing:-.035em;margin-top:10px}
p.sub{color:#56637D;font-size:14.5px;margin-top:8px;line-height:1.55}
label{display:block;font-size:13px;font-weight:600;margin-top:24px}
input{
  width:100%;font:inherit;font-size:16px;margin-top:8px;padding:13px 14px;border:1px solid #D5DDEB;border-radius:12px;
  background:#F6F8FC;color:#0A1224;
}
input:focus{outline:2px solid #1257FF;outline-offset:1px;background:#fff}
button{
  width:100%;margin-top:16px;font:inherit;font-weight:700;font-size:15.5px;color:#fff;cursor:pointer;
  background:#1257FF;border:0;border-radius:12px;padding:14px;box-shadow:0 10px 24px -10px rgba(18,87,255,.8);
}
button:hover{background:#0B45D8}
.err{margin-top:16px;font-size:14px;color:#B42318;background:#FDECEC;border:1px solid #F7C9C4;border-radius:10px;padding:10px 12px}
.foot{margin-top:22px;font-size:12px;color:#8793AB;text-align:center}
</style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#1257FF"/><path d="M11 10.5 H23 V20.5 A5 5 0 0 1 13 20.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><circle cx="11" cy="10.5" r="2.9" fill="#fff"/></svg>
      <b>JRNEE<i>.ai</i></b>
    </div>
    <div class="k">Website Hub</div>
    <h1>Sign in</h1>
    <p class="sub">Client website performance, live from Google Analytics, Search Console and Netlify.</p>
    <!--MSG-->
    <label for="pw">Admin password</label>
    <input id="pw" name="password" type="password" required autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div class="foot">JRNEE Technologies LLC · Private</div>
  </form>
</body>
</html>
