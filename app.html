<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>JRNEE Website Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>(function(){var t='light';try{if(localStorage.getItem('hub-theme')==='dark')t='dark'}catch(e){}document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{
  --bg:#F6F8FC;--surface:#fff;--soft:#F2F5FB;--ink:#0A1224;--slate:#56637D;--muted:#8793AB;--line:#E3E8F2;
  --blue:#1257FF;--blue-soft:#EAF0FF;--good:#0E9F6E;--good-bg:#E7F7F0;--bad:#C2410C;--bad-bg:#FFF1E8;
  --warn:#9A6700;--warn-bg:#FFF6E3;--cyan:#06B6D4;--violet:#7C5CFF;--amber:#F59E0B;--green:#10B981;--rose:#FF4D8D;
  --shadow:0 1px 2px rgba(10,18,36,.04),0 10px 28px -18px rgba(10,18,36,.22);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0F1C;--surface:#111A2C;--soft:#0F1626;--ink:#EDF0F8;--slate:#A3ACC4;--muted:#7F8AA6;--line:#223052;
  --blue:#5B80FF;--blue-soft:#1A2750;--good:#5ED39A;--good-bg:#11291E;--bad:#F2A07A;--bad-bg:#2E1C12;
  --warn:#F2BE5E;--warn-bg:#2C2412;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---- top bar ---- */
.top{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(170%) blur(14px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-weight:800;font-size:16.5px;letter-spacing:-.04em}
.brand b i{font-style:normal;color:var(--blue)}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.top .sp{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.tbtn:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
@media (max-width:620px){.tbtn span{display:none}.brand small{display:none}}

/* ---- common ---- */
main{padding:30px 0 70px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
h1{font-size:clamp(25px,3.4vw,36px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
h2{font-size:18px;font-weight:800;letter-spacing:-.03em}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sec{margin-top:18px;padding:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h p{font-size:13.5px;color:var(--muted)}
.notice{
  border-radius:14px;padding:14px 16px;font-size:14px;margin-top:16px;
  background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);
}
.notice b{color:var(--ink)}
.notice code{font-family:var(--mono);font-size:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);padding:1px 6px;border-radius:5px;color:var(--ink)}
.empty{
  border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px;
}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:70px 0;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- client list ---- */
.list-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.list-h h1{margin-top:8px}
.grid{display:grid;gap:14px;margin-top:22px}
@media (min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
.cc{display:block;padding:20px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.cc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.cc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet))}
.ct{display:flex;align-items:center;gap:12px}
.tile{
  width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(140deg,var(--blue),var(--violet));letter-spacing:-.02em;
}
.tile.big{width:54px;height:54px;border-radius:15px;font-size:17px}
.ct b{font-size:16px;font-weight:800;letter-spacing:-.03em;display:block}
.ct span.d{font-size:13px;color:var(--muted)}
.status{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--slate);border:1px solid var(--line);white-space:nowrap}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cs div{background:var(--soft);border-radius:12px;padding:12px}
.cs small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cs b{font-size:21px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.conns{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.conn{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;
  background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.conn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5}
.conn.on{color:var(--good);background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.conn.on::before{background:var(--good);opacity:1}
.prob{margin-top:12px;font-size:12.5px;color:var(--bad);background:var(--bad-bg);border-radius:10px;padding:8px 10px}

/* ---- deltas ---- */
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.dl.up{color:var(--good);background:var(--good-bg)}
.dl.down{color:var(--bad);background:var(--bad-bg)}
.dl.flat{color:var(--muted);background:var(--soft)}

/* ---- report ---- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--slate);margin-bottom:18px}
.back:hover{color:var(--blue)}
.rh{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.rt{display:flex;align-items:center;gap:14px}
.rt h1{margin-top:4px}
.rt .d{font-size:14px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pills{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.pills button{border:0;background:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;color:var(--slate)}
.pills button.on{background:var(--blue);color:#fff}
.stamp{margin-top:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--good);background:var(--good-bg);border-radius:20px;padding:4px 9px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--blue))}
.kpi small{display:block;font-size:12.5px;font-weight:600;color:var(--slate)}
.kpi .v{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.045em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12.5px;color:var(--muted);margin-top:4px}

.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .lc{fill:none;stroke:var(--blue);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .lp{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 5;opacity:.7}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--slate);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--blue);display:inline-block}
.legend i.p{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 8px)}

.two{display:grid;gap:18px}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}.two>.sec{margin-top:18px}}
.bars{display:grid;gap:12px}
.bar .bl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.bar .bl b{font-weight:700}
.bar .bl span{color:var(--muted);font-variant-numeric:tabular-nums}
.bar .tr{height:8px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--bc,var(--blue))}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 8px 10px}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.q{font-weight:600;word-break:break-word}
td.pth{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--slate)}
.tscroll{overflow-x:auto}

.devs{display:flex;gap:10px;flex-wrap:wrap}
.dev{flex:1;min-width:120px;background:var(--soft);border-radius:12px;padding:14px}
.dev small{display:block;font-size:12.5px;color:var(--slate);font-weight:600;text-transform:capitalize}
.dev b{font-size:24px;font-weight:800;letter-spacing:-.04em}

.leads{display:grid;gap:10px}
.lead{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}
.lead .lh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lead .lh b{font-weight:800;letter-spacing:-.02em}
.lead .lh span{font-size:12.5px;color:var(--muted)}
.lead .lc{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--slate);margin-top:4px}
.lead .lc a{color:var(--blue);font-weight:600}
.lead p{font-size:14px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue)}

.foot{margin-top:34px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* ---- admin tabs ---- */
.tabs{display:flex;gap:4px;margin-left:14px}
.tabs a{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:10px;color:var(--slate);white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{background:var(--blue-soft);color:var(--blue)}
@media (max-width:620px){.brand b{display:none}.tabs{margin-left:4px}.tabs a{padding:7px 9px;font-size:12.5px}}

/* ---- dashboard ---- */
.alerts{display:grid;gap:10px}
.al{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}
.al > i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.al .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.al b{display:block;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.al p{font-size:13.5px;color:var(--slate);margin-top:2px}
.al .go{margin-left:auto;font-size:13px;font-weight:700;color:var(--blue);white-space:nowrap;padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--slate)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ok{color:var(--good);font-weight:800}
.no{color:var(--muted)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap}
.pill.ready{color:var(--good);background:var(--good-bg)}
.pill.todo{color:var(--warn);background:var(--warn-bg)}
td.c{text-align:center}
th.c{text-align:center}

/* present mode and client logins: no admin controls, no unconnected sections */
body.present .admin,body.client .admin{display:none !important}
body.present .hide-present,body.client .hide-present{display:none !important}
body.present .logout{display:none !important}
.exitp{display:none}
body.present .exitp{display:inline-flex}


/* ---------- reports ---------- */
.rtabs{display:flex;gap:6px;margin:18px 0 4px}
.rtabs button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--slate)}
.rtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rlist{display:grid;gap:10px;margin-top:16px}
.ritem{display:flex;align-items:center;gap:13px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:border-color .2s,transform .2s}
.ritem:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line));transform:translateY(-1px)}
.ritem .m{flex:1;min-width:0}
.ritem b{display:block;font-weight:800;letter-spacing:-.02em}
.ritem span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paste{width:100%;min-height:190px;font:inherit;font-size:14.5px;line-height:1.6;padding:13px 15px;margin-top:12px;
  border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--ink);resize:vertical}
.paste.short{min-height:110px}
.paste:focus{outline:2px solid var(--blue);outline-offset:1px;background:var(--surface)}
.read{margin-top:12px;border:1px solid var(--line);border-radius:13px;background:var(--soft);padding:13px 15px}
.read .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.read ul{list-style:none;margin-top:9px;display:grid;gap:5px}
.read li{font-size:13.5px;color:var(--slate)}
.per{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.per button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--slate)}
.per button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dates{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--slate)}
.dates input{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}

/* report document */
.doc{margin-top:16px}
.cover{padding:32px 26px;position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;right:-90px;top:-120px;width:420px;height:420px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--blue) 15%,transparent),transparent 70%)}
.cover>*{position:relative}
.cover h1{font-size:clamp(25px,4.4vw,37px);font-weight:800;letter-spacing:-.04em;line-height:1.14;margin-top:11px;max-width:22ch}
.cover .who{display:flex;align-items:center;gap:12px;margin-top:20px}
.cover .who b{display:block;font-weight:800;letter-spacing:-.02em}
.cover .who span{font-size:13px;color:var(--muted)}
.dlede{font-size:16.5px;color:var(--slate);margin-top:16px;max-width:60ch;line-height:1.6}
.dsec{margin-top:14px;padding:22px 24px}
.dsec h3{font-size:11.5px;font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dnums{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}
@media (max-width:760px){.dnums{grid-template-columns:repeat(2,1fr)}}
.grp{margin-top:14px}
.grp b{display:block;font-weight:800;letter-spacing:-.02em;font-size:15.5px}
.grp ul{list-style:none;margin-top:7px;display:grid;gap:6px}
.grp li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--slate)}
.grp li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--blue));flex:none;margin-top:8px}
.mv{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft);--m:var(--good);margin-top:10px}
.mv .ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--m) 14%,transparent)}
.mv .ic svg{width:17px;height:17px;stroke:var(--m);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mv b{display:block;font-weight:800;letter-spacing:-.02em}
.mv span{font-size:14px;color:var(--slate)}
.room{border-color:color-mix(in srgb,var(--warn) 30%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.opp{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.opp .n{font-family:var(--mono);font-size:11px;color:var(--warn);padding-top:3px}
.opp b{display:block;font-weight:800;letter-spacing:-.02em}
.opp span{font-size:14px;color:var(--slate)}
.dnext ol{list-style:none;counter-reset:s;display:grid;gap:9px;margin-top:12px}
.dnext li{counter-increment:s;display:flex;gap:11px;align-items:flex-start;font-size:15px;color:var(--slate)}
.dnext li::before{content:counter(s);font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--blue-soft);
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.dfoot{margin-top:14px;padding:16px 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.editable{outline:1px dashed transparent;border-radius:8px;padding:2px 5px;margin:-2px -5px;transition:outline-color .2s,background .2s}
body.editing .editable{outline-color:color-mix(in srgb,var(--blue) 45%,transparent)}
body.editing .editable:focus{outline:2px solid var(--blue);background:var(--surface)}
.saving{font-size:12.5px;color:var(--muted)}


/* ---------- full report ---------- */
.secs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '—' : Math.round(n).toLocaleString('en-US');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate = d => MON[d.getMonth()] + ' ' + d.getDate();
function dur(s){ s = Math.round(s || 0); const m = Math.floor(s / 60), r = s % 60; return m ? `${m}m ${String(r).padStart(2,'0')}s` : `${r}s`; }
function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s/60) + ' min ago';
  if (s < 86400) return Math.round(s/3600) + ' hr ago';
  const d = Math.round(s/86400); return d === 1 ? 'yesterday' : d + ' days ago';
}
function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* change vs previous period */
function delta(c, p){
  if (c == null || p == null) return '';
  if (!p) return c ? '<span class="dl up">New</span>' : '';
  const pct = Math.round((c - p) / p * 100);
  if (pct === 0) return '<span class="dl flat">Same</span>';
  return `<span class="dl ${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
}
function posDelta(c, p){
  if (!c || !p) return '';
  const d = +(p - c).toFixed(1);
  if (Math.abs(d) < 0.1) return '<span class="dl flat">Same</span>';
  return `<span class="dl ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`;
}

const CHANNELS = {
  'Organic Search':'Google and other search engines','Direct':'Came straight to the site','Organic Social':'Social media',
  'Referral':'Links from other websites','Paid Search':'Paid search ads','Paid Social':'Paid social ads','Email':'Email',
  'Organic Maps':'Google Maps','Organic Video':'YouTube and video','Display':'Display ads','Cross-network':'Google ad network',
  'Unassigned':'Other / not identified','Organic Shopping':'Shopping','Paid Other':'Other paid','Affiliates':'Affiliates','SMS':'Text message'
};
const BAR_COLORS = ['var(--blue)','var(--cyan)','var(--violet)','var(--green)','var(--amber)','var(--rose)'];

async function api(p){
  const r = await fetch(p, { credentials:'same-origin' });
  if (r.status === 401) { location.href = '/'; throw new Error('signed out'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
const loading = msg => `<div class="loading"><span class="spin"></span>${esc(msg)}</div>`;

const state = { id:null, days:28 };

function dayDate(n, i){ const d = new Date(); d.setDate(d.getDate() - (n - i)); return d; }
function lineChart(cur, prev, n){
  const W = 760, H = 240, pl = 42, pr = 14, pt = 14, pb = 28;
  const max = niceMax(Math.max(1, ...cur, ...prev));
  const x = i => pl + (W - pl - pr) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const path = a => a.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  let g = '';
  for (let k = 0; k <= 4; k++){
    const v = max * k / 4;
    g += `<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  }
  [...new Set([0, Math.round((n-1)/3), Math.round(2*(n-1)/3), n-1])].forEach(i => {
    g += `<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${fdate(dayDate(n, i))}</text>`;
  });
  const area = path(cur) + ` L${x(n-1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitors per day, this period compared with the one before">
    <defs><linearGradient id="fillG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--blue);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--blue);stop-opacity:0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#fillG)"/><path class="lp" d="${path(prev)}"/><path class="lc" d="${path(cur)}"/></svg>`;
}

function notConnected(label, how){
  return `<div class="empty admin"><b>${esc(label)} isn't connected for this client</b>${how}</div>`;
}
function sourceError(msg){ return `<div class="notice admin">${esc(msg)}</div>`; }

function sectionState(err, label, how){
  if (err === 'not_connected') return { hideInPresent:true, html:notConnected(label, how) };
  if (err) return { hideInPresent:true, html:sourceError(err) };
  return null;
}

async function showReport(fresh){
  $('#presentBtn').hidden = false;
  view.innerHTML = loading('Pulling live numbers…');
  let r;
  try { r = await api(`/api/report?c=${encodeURIComponent(state.id)}&days=${state.days}` + (fresh ? '&refresh=1' : '')); }
  catch(e){ view.innerHTML = `<a class="back admin" href="#/clients">← All clients</a><div class="notice"><b>Couldn't load this report.</b> ${esc(e.message)}</div>`; return; }

  const c = r.client, n = r.days, ga = r.ga, gs = r.gsc, ld = r.leads, er = r.errors || {};
  const start = dayDate(n, 0), end = dayDate(n, n - 1);

  /* KPIs */
  const kpi = (label, value, d, note, color, missing) => `<div class="kpi card ${missing ? 'hide-present' : ''}" style="--kc:${color}">

  let leadVal = '—', leadD = '', leadNote = 'Not connected yet', leadMissing = true;
  if (ld){ leadVal = fmt(ld.count.cur); leadD = delta(ld.count.cur, ld.count.prev); leadNote = 'Form submissions from the site'; leadMissing = false; }
  else if (ga && ga.keyEvents.cur != null){ leadVal = fmt(ga.keyEvents.cur); leadD = delta(ga.keyEvents.cur, ga.keyEvents.prev); leadNote = 'Key actions tracked in Analytics'; leadMissing = false; }

  const kpis = `<div class="kpis">
    ${kpi('People who visited', ga ? fmt(ga.totals.cur.activeUsers) : '—', ga ? delta(ga.totals.cur.activeUsers, ga.totals.prev.activeUsers) : '',
        ga ? `${fmt(ga.totals.cur.sessions)} visits · ${dur(ga.totals.cur.averageSessionDuration)} average` : 'Analytics not connected', 'var(--blue)', !ga)}
    ${kpi('Leads', leadVal, leadD, leadNote, 'var(--green)', leadMissing)}
    ${kpi('Clicks from Google', gs ? fmt(gs.totals.cur.clicks) : '—', gs ? delta(gs.totals.cur.clicks, gs.totals.prev.clicks) : '',
        gs ? `Shown ${fmt(gs.totals.cur.impressions)} times in search` : 'Search Console not connected', 'var(--cyan)', !gs)}
    ${kpi('Average Google position', gs && gs.totals.cur.position ? gs.totals.cur.position.toFixed(1) : '—', gs ? posDelta(gs.totals.cur.position, gs.totals.prev.position) : '',
        gs ? 'Lower is better · 1 is the top result' : 'Search Console not connected', 'var(--violet)', !gs)}
  </div>`;

  /* visitors chart */
  let chart;
  const gaState = sectionState(er.ga, 'Google Analytics', 'Add this client\'s GA4 property ID to <code>clients.json</code>.');
  if (ga){
    const total = ga.series.cur.reduce((a,b) => a+b, 0);
    chart = `<section class="sec card">
      <div class="sec-h"><h2>Visitors per day</h2>
        <div class="legend"><span><i></i>Last ${n} days</span><span><i class="p"></i>The ${n} days before</span></div></div>
      ${total ? lineChart(ga.series.cur, ga.series.prev, n) : '<div class="empty"><b>No visits recorded in this period</b>Numbers appear here once the site is live and getting traffic.</div>'}
    </section>`;
  } else chart = `<section class="sec card hide-present"><div class="sec-h"><h2>Visitors per day</h2></div>${gaState.html}</section>`;

  /* sources */
  let sources;
  if (ga){
    const tot = ga.channels.reduce((a, x) => a + x.sessions, 0) || 1;
    sources = ga.channels.length ? `<div class="bars">${ga.channels.slice(0, 7).map((ch, i) => {
      const p = ch.sessions / tot;
      return `<div class="bar" style="--bc:${BAR_COLORS[i % BAR_COLORS.length]}"><div class="bl"><b>${esc(CHANNELS[ch.name] || ch.name)}</b><span>${Math.round(p*100)}%</span></div><div class="tr"><i style="width:${Math.max(2, p*100)}%"></i></div></div>`;
    }).join('')}</div>` : '<div class="empty">No visits in this period yet.</div>';

      <div class="lc">${x.phone ? `<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>` : ''}${x.email ? `<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>` : ''}</div>
      ${x.message ? `<p>${esc(x.message)}</p>` : ''}
    </div>`).join('')}</div>` : '<div class="empty"><b>No form leads in this period</b>New submissions from the site will show up here.</div>';
  } else leads = ldState.html;

  const hp = st => st ? 'hide-present' : '';
  view.innerHTML = `
    <a class="back admin" href="#/clients">← All clients</a>
    <div class="rh">
      <div class="rt">
        <span class="tile big">${esc(c.initials)}</span>
        <div><div class="eyebrow">Website performance report</div><h1>${esc(c.name)}</h1><div class="d">${esc(c.domain)}</div></div>
      </div>
      <div class="ctl">
        <div class="pills" role="group" aria-label="Time period">
          ${[7,28,90].map(d => `<button type="button" data-d="${d}" class="${d === n ? 'on' : ''}">${d} days</button>`).join('')}
        </div>
        <button class="tbtn admin" id="refreshRep" type="button"><svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-2-4.5M16 4v3.5h-3.5"/></svg><span>Refresh</span></button>
      </div>
    </div>
    <div class="stamp"><span class="live">Live data</span>${fdate(start)} – ${fdate(end)} · updated ${esc(ago(r.generated))}</div>

const RICON = {

const post = async (p, body) => {
  const r = await fetch(p, { method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (r.status === 401) { location.href = '/'; throw new Error('signed out'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
};

function newReport(cid){
  REP = null;

    <section class="sec card">
      <div class="sec-h"><h2>Period</h2><p>Month end is the usual one, but any range works.</p></div>
      <div class="per" id="perPick">${PERIOD_OPTS.map(p=>`<button data-p="${p.id}" class="${p.id===repPeriod?'on':''}">${p.t}</button>`).join('')}</div>
      <div class="dates" id="dateRow" style="display:${repPeriod==='custom'?'flex':'none'}">
        <label>From <input type="date" id="dFrom" max="${yest}" value="${weekAgo}"></label>

      </div>
      <p class="plain" id="periodNote" style="margin-top:12px"></p>
      <div style="margin-top:16px"><button class="tbtn pri" id="prep" type="button">Pull the numbers →</button></div>
    </section>`;

  const note = () => {
    const el = $('#periodNote');
    if (repPeriod !== 'custom'){
      el.textContent = 'Compared against the same number of days immediately before.';
      return true;
    }
    const a = $('#dFrom').value, b = $('#dTo').value;
    if (!a || !b){ el.textContent = 'Pick both dates to continue.'; return false; }
    const from = a < b ? a : b, to = a < b ? b : a;
    const days = Math.round((new Date(to) - new Date(from)) / 864e5) + 1;
    const nice = s => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
    el.textContent = `Covering ${nice(from)} to ${nice(to)} — ${days} day${days===1?'':'s'}, compared against the ${days} days before.`;
    return true;
  };

  view.querySelectorAll('#perPick button').forEach(b => b.onclick = () => {
    repPeriod = b.dataset.p;
    view.querySelectorAll('#perPick button').forEach(x=>x.classList.toggle('on', x===b));

    const a = $('#dFrom').value, b = $('#dTo').value;
    const payload = { client:cid, period:repPeriod };
    if (repPeriod === 'custom'){ payload.start = a < b ? a : b; payload.end = a < b ? b : a; }
    try {

      view.insertAdjacentHTML('beforeend', `<div class="notice"><b>Couldn't pull the numbers.</b> ${esc(e.message)}</div>`); }
  };
}

function niceMax(m){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(m,1)))); return [1,2,2.5,5,10].map(s=>s*p).find(s=>s>=m)||10; }
function reportChart(cur, prev){
  const n = cur.length; if (!n) return '';
  const W=760,H=230,pl=44,pr=14,pt=14,pb=26;
  const vals = cur.map(d=>d.v), pvals = (prev||[]).map(d=>d.v);
  const max = niceMax(Math.max(1,...vals,...pvals));
  const x = i => pl + (W-pl-pr) * (n<=1?0:i/(n-1));
  const y = v => pt + (H-pt-pb) * (1 - v/max);
  const line = a => a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  let g='';
  for (let k=0;k<=4;k++){ const v=max*k/4;
    g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  const lab = i => { const d=cur[i]?.date||''; return d.length===8 ? `${+d.slice(6,8)}/${+d.slice(4,6)}` : ''; };
  [...new Set([0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1])].forEach(i=>{
    g+=`<text class="ax" x="${x(i)}" y="${H-7}" text-anchor="middle">${lab(i)}</text>`; });
  const area = line(vals)+` L${x(n-1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const lx = x(n-1), ly = y(vals[n-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitors per day">
    <defs>
      <linearGradient id="fg" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" style="stop-color:#1257FF;stop-opacity:.26"/><stop offset="1" style="stop-color:#1257FF;stop-opacity:0"/></linearGradient>
      <linearGradient id="strokeG" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" style="stop-color:#22D3EE"/><stop offset="55%" style="stop-color:#1257FF"/><stop offset="100%" style="stop-color:#A78BFA"/></linearGradient>
    </defs>${g}
    <path d="${area}" fill="url(#fg)"/>
    ${pvals.length?`<path class="lp" d="${line(pvals)}"/>`:''}
    <path class="lc draw" d="${line(vals)}"/>
    <circle class="tipg" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5"/>
    <circle class="tip" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5"/></svg>`;
}

function animateDoc(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // reveal
  const rv = [...view.querySelectorAll('.rv')];
  if (reduce) rv.forEach(e=>e.classList.add('in'));
  else {
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }}),
      {threshold:.08, rootMargin:'0px 0px -40px'});
    rv.forEach(e=>io.observe(e));
    setTimeout(()=>rv.slice(0,2).forEach(e=>e.classList.add('in')), 30);
  }
  // bars and rings fill
  requestAnimationFrame(()=>{
    view.querySelectorAll('.bar .tr i').forEach(i=>{ i.style.width = i.dataset.w + '%'; });
    view.querySelectorAll('[data-dash]').forEach(s=>{ s.style.strokeDasharray = s.dataset.dash; });
  });
  // numbers count up
  view.querySelectorAll('[data-count]').forEach(el=>{
    const raw = el.dataset.count, m = String(raw).match(/^([^\d-]*)(-?[\d,.]+)(.*)$/);
    if (!m || reduce) { el.textContent = raw; return; }
    const pre = m[1], suf = m[3], target = parseFloat(m[2].replace(/,/g,''));
    const dec = (m[2].split('.')[1] || '').length;
    let t0 = null;
    const step = ts => { if(!t0) t0 = ts;
      const p = Math.min((ts-t0)/900, 1), e = 1 - Math.pow(1-p, 3);
      const v = target * e;
      el.textContent = pre + (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-US')) + suf;
      if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

      `${x.t?`<span class="t">${esc(x.t)}</span>`:''}<p>${esc(x.text)}</p>`).join('')}</div>`;
  };
  const ask = key => (r.id && r.status) ? askBlock(key) : '';
  const xp = key => {
    const d = dataBits(key), gen = EXPLAIN[key];
    if (!d && !gen) return '';
    return `<details class="xp"><summary>${d ? 'What this means for you' : 'Explain this in more detail'}</summary>
      <div class="xpb">${d}${(d && gen) ? '<div class="xpsep">In general</div>' : ''}${gen || ''}</div></details>`;
  };
  const sec = (key, title, body, plain='', extra='') => {
    if (!body || !on(key)) return '';
    chapter++;
    return `<section class="card dsec rv ${extra}" style="--sc:${SC[(chapter-1)%SC.length]}">
      <h3><span class="chno">${String(chapter).padStart(2,'0')}</span>${title}</h3>
      ${plain?`<p class="plain">${plain}</p>`:''}${body}${xp(key)}${ask(key)}</section>`;
  };

  /* numbers */
  const nums = [];
  if (lead) nums.push(`<div class="kpi card" style="--kc:#10B981"><small>${n.leads?'Enquiries':'Key actions'}</small>
    <div class="v"><span data-count="${fmt(lead.cur)}">0</span>${delta(lead.cur,lead.prev)}</div><div class="n">${fmt(lead.prev)} the period before</div></div>`);
  if (n.visitors) nums.push(`<div class="kpi card" style="--kc:#1257FF"><small>Visitors</small>
    <div class="v"><span data-count="${fmt(n.visitors.cur)}">0</span>${delta(n.visitors.cur,n.visitors.prev)}</div><div class="n">${fmt(n.visitors.prev)} before</div></div>`);
  if (n.clicks) nums.push(`<div class="kpi card" style="--kc:#06B6D4"><small>Clicks from Google</small>
    <div class="v"><span data-count="${fmt(n.clicks.cur)}">0</span>${delta(n.clicks.cur,n.clicks.prev)}</div><div class="n">${fmt(n.clicks.prev)} before</div></div>`);
  if (n.position) nums.push(`<div class="kpi card" style="--kc:#7C5CFF"><small>Average position</small>
    <div class="v"><span data-count="${n.position.cur}">0</span>${delta(n.position.cur,n.position.prev,true)}</div><div class="n">lower is better · was ${n.position.prev}</div></div>`);

  /* highlights */
  const HC = ['#10B981','#1257FF','#7C5CFF'];
  const hl = (c.highlights||[]).length ? `<div class="hl">${c.highlights.map((x,i)=>
    `<div class="h" style="--hc:${HC[i%3]}"><b data-count="${esc(x.big)}">0</b><span>${esc(x.label)}</span></div>`).join('')}</div>` : '';

  /* traffic */
  const chart = n.series && n.series.length ? `${reportChart(n.series, n.seriesPrev)}
    <div class="legend"><span><i></i>This period</span><span><i class="p"></i>The period before</span></div>` : '';
  const totCh = (n.channels||[]).reduce((a,x)=>a+x.sessions,0) || 1;
  const sources = (n.channels||[]).length ? `<div class="bars">${n.channels.slice(0,6).map((ch,i)=>{
      const pc = ch.sessions/totCh;
      return `<div class="bar" style="--bc:${BARC[i%BARC.length]}"><div class="bl"><b>${esc(CH_LABEL[ch.name]||ch.name)}</b>
        <span>${Math.round(pc*100)}% · ${fmt(ch.sessions)}</span></div><div class="tr"><i data-w="${Math.max(2,pc*100).toFixed(1)}"></i></div></div>`;
    }).join('')}</div>` : '';
  const totDv = (n.devices||[]).reduce((a,x)=>a+x.sessions,0) || 1;
  let devices = '';
  if ((n.devices||[]).length){
    const C = 2*Math.PI*42; let off = 0;
    const segs = n.devices.map((d,i)=>{
      const frac = d.sessions/totDv, len = frac*C, s = `<circle class="seg" r="42" cx="60" cy="60"
        stroke="${BARC[i%BARC.length]}" data-dash="${len.toFixed(1)} ${(C-len).toFixed(1)}"
        transform="rotate(${(off/C*360)-90} 60 60)"/>`; off += len; return s; }).join('');
    const top = n.devices[0];
    devices = `<div class="donut"><svg viewBox="0 0 120 120">${segs}
        <text class="mid" x="60" y="58" text-anchor="middle">${Math.round(top.sessions/totDv*100)}%</text>
        <text class="sub" x="60" y="72" text-anchor="middle">${esc(top.name.toUpperCase())}</text></svg>
      <div class="devk" style="flex-direction:column;gap:9px;align-items:flex-start">${n.devices.map((d,i)=>
        `<span><em style="background:${BARC[i%BARC.length]}"></em>${esc(d.name)} · <b style="color:var(--ink)">${Math.round(d.sessions/totDv*100)}%</b> · ${fmt(d.sessions)} visits</span>`).join('')}</div></div>`;
  }

  /* search */
  let search = '';
  if (kw){
    const movedRow = r => `<tr><td class="q">${esc(r.q)}</td><td class="r">${fmt(r.clicks)}</td>
      <td class="r">${fmt(r.impressions)}</td><td class="r">${r.position.toFixed(1)}</td>
      <td class="r">${r.isNew?'<span class="mvd new">New</span>':r.move>=1?`<span class="mvd">▲ ${r.move}</span>`:'—'}</td></tr>`;
    const ringPct = kw.total ? kw.pageOne/kw.total : 0, RC = 2*Math.PI*30;
    search = `
      <div class="ring"><svg viewBox="0 0 74 74">
        <circle class="bg" r="30" cx="37" cy="37"/>
        <circle class="fg" r="30" cx="37" cy="37" transform="rotate(-90 37 37)" data-dash="${(ringPct*RC).toFixed(1)} ${RC.toFixed(1)}"/>
        <text class="num" x="37" y="43" text-anchor="middle">${kw.pageOne}</text></svg>
        <span class="lbl"><b>${kw.pageOne} of ${kw.total} searches are on page one</b>
        <span>${kw.pageOnePrev!=null?`It was ${kw.pageOnePrev} the period before.`:''}</span></span></div>
      ${kw.risers.length?`<h4 style="margin-top:20px;font-size:14.5px;font-weight:800;letter-spacing:-.02em">Searches that climbed</h4>
        <table class="ktab"><thead><tr><th>Search</th><th class="r">Clicks</th><th class="r">Shown</th><th class="r">Position</th><th class="r">Moved</th></tr></thead>
        <tbody>${kw.risers.map(movedRow).join('')}</tbody></table>`:''}
      ${kw.fresh.length?`<h4 style="margin-top:22px;font-size:14.5px;font-weight:800;letter-spacing:-.02em">New searches you now show up for</h4>
        <table class="ktab"><thead><tr><th>Search</th><th class="r">Clicks</th><th class="r">Shown</th><th class="r">Position</th><th class="r"></th></tr></thead>
        <tbody>${kw.fresh.map(movedRow).join('')}</tbody></table>`:''}
      ${kw.top.length?`<h4 style="margin-top:22px;font-size:14.5px;font-weight:800;letter-spacing:-.02em">Your biggest searches</h4>
        <table class="ktab"><thead><tr><th>Search</th><th class="r">Clicks</th><th class="r">Shown</th><th class="r">Position</th><th class="r">Change</th></tr></thead>
        <tbody>${kw.top.map(movedRow).join('')}</tbody></table>`:''}`;
  }

  /* pages */
  const pages = (n.pages||[]).length ? `<table class="ktab"><thead><tr><th>Page</th><th class="r">Views</th><th class="r">Avg. time</th></tr></thead>
    <tbody>${n.pages.map(pg=>`<tr><td class="q" style="font-family:var(--mono);font-size:12.5px;font-weight:400">${esc(pg.path)}</td>
      <td class="r">${fmt(pg.views)}</td><td class="r">${Math.round(pg.avgTime)}s</td></tr>`).join('')}</tbody></table>` : '';

  /* leads */
  const items = (n.leadItems||[]);
  const leads = lead ? `<span class="p1"><b>${fmt(lead.cur)}</b> enquiries this period</span>
    ${lead.prev?`<span class="p1"><b>${fmt(lead.prev)}</b> the period before</span>`:''}
    ${items.length?items.slice(0,10).map(x=>`<div class="lead2">
      <div class="lh"><b>${esc(x.name||'No name given')}</b><span>${esc(fdt(x.when))}${x.form?` · ${esc(x.form)}`:''}</span></div>
      <div class="lc">${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:''}${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:''}</div>
      ${x.message?`<p>${esc(x.message)}</p>`:''}</div>`).join(''):''}` : '';

  /* written sections */
  const groups = (c.groups||[]).map(g=>`<div class="grp" style="--c:${g.c}"><b>${esc(g.b)}</b>
    <ul>${g.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  const moved = (c.moved||[]).map((m,i)=>`<div class="mv" style="--m:${m.down?'#C2410C':['var(--good)','#1257FF','#7C5CFF'][i%3]}">
    <div class="ic">${RICON[m.icon]||RICON.up}</div>
    <div><b>${esc(m.title)}</b><span>${esc(m.body)}</span>
      ${m.why?`<div class="why"><b>Why</b>${esc(m.why)}</div>`:''}
      ${m.fix?`<div class="fix"><b>What we'll do</b>${esc(m.fix)}</div>`:''}
    </div></div>`).join('');
  const room = (c.room||[]).map((x,i)=>`<div class="opp"><span class="n">${String(i+1).padStart(2,'0')}</span>
    <div><b>${esc(x.title)}</b><span>${esc(x.body)}</span>
    ${x.fix?`<div class="fix"><b>What we'll do</b>${esc(x.fix)}</div>`:''}</div></div>`).join('');
  const next = (c.next||[]).map(x=>`<li>${esc(x)}</li>`).join('');

  return `<div class="doc">
    <section class="card cover">
      <div class="eyebrow">${p.kind==='month'?'Monthly report':'Report'} · ${esc(p.label)} <span style="color:var(--muted)">· ${esc(p.span)}</span></div>
      <h1>${esc(c.headline)}</h1>
      <div class="who"><span class="tile">${esc(r.client.initials)}</span>
        <div><b>${esc(r.client.name)}</b><span>${esc(r.client.domain)}</span></div></div>
      <p class="dlede">${esc(c.summary)}</p>
      ${on('highlights') ? hl : ''}
    </section>
    <section class="card dsec rv" style="--sc:#10B981"><h3><span class="chno">01</span>${p.kind==='month'?'The month':'The period'} at a glance</h3>
      <p class="plain">The headline numbers for this period, each one next to the same stretch of days before it.</p>
      <div class="kpis" style="margin-top:14px">${nums.join('')}</div>
      ${xp('glance')}${ask('glance')}</section>
    ${sec('chart','Visitors, day by day', chart,
      'Every dot is one day, so you can see the rhythm of the period rather than just a total.')}
    ${((sources&&on('sources'))||(devices&&on('devices'))) ? `<div class="split">
      ${sources&&on('sources')?`<section class="card dsec rv" style="--sc:#06B6D4"><h3><span class="chno">${String(++chapter).padStart(2,'0')}</span>Where visitors came from</h3>
        <p class="plain">How people arrived at the site.</p>${sources}
        ${xp('sources')}${ask('sources')}</section>`:''}
      ${devices&&on('devices')?`<section class="card dsec rv" style="--sc:#7C5CFF"><h3><span class="chno">${String(++chapter).padStart(2,'0')}</span>What they were using</h3>
        <p class="plain">Phone, computer or tablet.</p>${devices}
        ${xp('devices')}${ask('devices')}</section>`:''}</div>` : ''}
    ${sec('search','How you show up on Google', search,
      'What happens on Google before anyone reaches your site. <b>Position 1 is the top result, and page one ends around 10.</b>')}
    ${sec('pages','Most-visited pages', pages,
      'Where people spent their time once they arrived.')}
    ${sec('leads','Enquiries', leads,
      'Everyone who reached out through the website in this period.')}
    ${sec('work','What we did', groups)}
    ${sec('moved','What moved', moved,
      'The changes worth your attention — <b>including anything that went the wrong way.</b>')}
    ${sec('room','Where we see room, and what we\'ll do', room, 'Each one found in your own numbers, each with a plan attached.', 'room')}
    ${(next && on('next'))?`<section class="card dsec dnext rv" style="--sc:#FF4D8D">
      <h3><span class="chno">${String(++chapter).padStart(2,'0')}</span>What we're doing ${esc(p.nextLabel)}</h3><ol>${next}</ol></section>`:''}
    <section class="card dsec closing rv">
      <h3>The short version</h3>
      <p>${esc(c.summary)}</p>
      <p style="margin-top:14px"><b>Questions about any of this?</b> Reply to the email this came with, or call us — we'd rather talk it through than have you guess at a number.</p>
    </section>
    <section class="card brandfoot rv">
      <svg class="bmark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="10" fill="#1257FF"/>
        <path d="M11 10.5 H23 V20.5 A5 5 0 0 1 13 20.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="11" cy="10.5" r="2.9" fill="#fff"/></svg>
      <div class="bword">JRNEE<i>.ai</i></div>
      <div class="btag">Custom AI-powered software built around how your business already runs</div>
      <div class="bline"></div>
      <div class="bmeta"><span>Prepared for ${esc(r.client.legal||r.client.name)}</span>
        <span>${esc(p.span)}</span>
        <span>Google Analytics · Search Console${n.connected.leads?' · leads':''}</span></div>
      <div class="bmeta" style="margin-top:6px"><span>JRNEE Technologies LLC · jrnee.ai</span></div>
    </section>
  </div>`;
}

function viewDoc(mode){
  // mode: 'draft' · 'published'
  document.body.classList.remove('editing');
  const bar = mode === 'published'
    ? `<div id="reportBar" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <span class="conn on">Published</span><span class="saving">Your client can see this</span><div style="flex:1"></div>
        <button class="tbtn" id="dlBtn" type="button">Download</button>
        <button class="tbtn" id="prBtn" type="button">Print / Save as PDF</button>
        <button class="tbtn" id="unpub" type="button">Move back to draft</button></div>`
    : `<div id="reportBar" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <button class="tbtn" id="backEdit" type="button">← Change what you pasted</button>
        <span class="saving" id="savedAt">Draft · only you can see this</span><div style="flex:1"></div>
        <button class="tbtn" id="dlBtn" type="button">Download</button>
        <button class="tbtn" id="prBtn" type="button">Print / Save as PDF</button>
        <button class="tbtn" id="delBtn" type="button">Delete draft</button>
        <button class="tbtn" id="saveDraft" type="button">Save draft</button>
        <button class="tbtn pri" id="publish" type="button">Publish to client</button></div>`;
  view.innerHTML = `<a class="back" href="#/reports/${encodeURIComponent(REP.clientId)}">← Reports</a>${bar}${docHtml()}`;
  animateDoc();

  const g = id => document.getElementById(id);
  if (g('dlBtn')) g('dlBtn').onclick = () => downloadReport();
  if (g('prBtn')) g('prBtn').onclick = () => print();
  if (g('delBtn')) g('delBtn').onclick = () => deleteDraft(REP.clientId, REP.id, REP.period.label);
  if (g('backEdit')) g('backEdit').onclick = () => editReport();
  if (g('saveDraft')) g('saveDraft').onclick = async () => { REP.status='draft';
    await post('/api/report/save', { report: REP }); g('savedAt').textContent = 'Saved'; };
  if (g('publish')) g('publish').onclick = async (e) => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Publishing…';
    try {
      await post('/api/report/publish', { report: REP });
      REP.status = 'published';
      const cid = REP.clientId, want = '#/reports/' + encodeURIComponent(cid);
      if (location.hash !== want) location.hash = want; else showReports(cid);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Publish to client';
      view.insertAdjacentHTML('afterbegin', `<div class="notice"><b>Couldn't publish.</b> ${esc(err.message)}</div>`);
    }
  };
  if (g('unpub')) g('unpub').onclick = async () => {
    await post('/api/report/unpublish', { client:REP.clientId, id:REP.id }); openReport(REP.clientId, REP.id); };
}

async function openReport(cid, id){
  view.innerHTML = loading('Opening…');
  try {
    REP = await api(`/api/report/item?c=${encodeURIComponent(cid)}&id=${encodeURIComponent(id)}`);
    document.body.classList.remove('editing');
    if (IS_CLIENT){
      view.innerHTML = `<a class="back" href="#/reports">← All reports</a>
        <div id="reportBar" style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <button class="tbtn" id="dlBtn" type="button">Download</button>
          <button class="tbtn" id="prBtn" type="button">Print / Save as PDF</button></div>${docHtml()}`;
      animateDoc();
      wireAsk();
      $('#dlBtn').onclick = () => downloadReport();
      $('#prBtn').onclick = () => print();
      return;
    }
    $('#presentBtn').hidden = false;
    viewDoc(REP.status === 'published' ? 'published' : 'draft');
  } catch(e){ view.innerHTML = `<div class="notice"><b>Couldn't open that report.</b> ${esc(e.message)}</div>`; }
}


/* ================= ask jrnee ================= */
const ASK_ICON = '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/><path d="M9.5 10a2.5 2.5 0 1 1 3.2 2.4c-.7.2-1.2.9-1.2 1.6"/><path d="M11.5 17h.01"/></svg>';
const ASK_MARK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M8 7h8v7a4 4 0 0 1-8 0"/><circle cx="8" cy="7" r="1.6" fill="#fff" stroke="none"/></svg>';

function askBlock(section){
  return `<div class="askwrap" data-ask="${section}">
    <button class="askbtn" type="button">${ASK_ICON}Have a question about this? Ask JRNEE</button>
  </div>`;
}

async function openAsk(wrap){
  const section = wrap.dataset.ask;
  if (wrap.querySelector('.askpanel')) return;
  wrap.querySelector('.askbtn').style.display = 'none';
  wrap.insertAdjacentHTML('beforeend', `<div class="askpanel">
    <div class="ah"><span class="mk">${ASK_MARK}</span>Ask JRNEE
      <button class="close" type="button" aria-label="Close">&times;</button></div>
    <div class="sugg"><span class="thinking"><i></i><i></i><i></i></span></div>
    <div class="thread"></div>
    <form class="askform"><input type="text" placeholder="Or ask anything about your report…" aria-label="Your question">
      <button type="submit">Ask</button></form>
  </div>`);
  const panel = wrap.querySelector('.askpanel');
  panel.querySelector('.close').onclick = () => { panel.remove(); wrap.querySelector('.askbtn').style.display = ''; };

  const qs = new URLSearchParams({ report: REP.id, section });
  if (!IS_CLIENT) qs.set('c', REP.clientId);
  try {
    const { suggestions } = await api('/api/ask/suggestions?' + qs);
    panel.querySelector('.sugg').innerHTML = suggestions
      .map(s => `<button type="button">${esc(s)}</button>`).join('');
    panel.querySelectorAll('.sugg button').forEach(b => b.onclick = () => sendAsk(panel, section, b.textContent));
  } catch(e){ panel.querySelector('.sugg').innerHTML = ''; }

  panel.querySelector('.askform').onsubmit = e => {
    e.preventDefault();
    const i = panel.querySelector('input'), q = i.value.trim();
    if (!q) return; i.value = '';
    sendAsk(panel, section, q);
  };
}

async function sendAsk(panel, section, question){
  const thread = panel.querySelector('.thread');
  const sugg = panel.querySelector('.sugg');
  if (sugg) sugg.innerHTML = '';
  thread.insertAdjacentHTML('beforeend', `<div class="qq">${esc(question)}</div>
    <div class="aa pending"><span class="thinking"><i></i><i></i><i></i></span></div>`);
  thread.lastElementChild.scrollIntoView({ block:'nearest', behavior:'smooth' });
  const body = { report: REP.id, section, question };
  if (!IS_CLIENT) body.client = REP.clientId;
  try {
    const r = await post('/api/ask', body);
    const el = thread.querySelector('.aa.pending');
    el.classList.remove('pending');
    if (r.routed) el.classList.add('routed');
    el.textContent = r.answer;
  } catch(err){
    const el = thread.querySelector('.aa.pending');
    el.classList.remove('pending');
    el.textContent = "Something went wrong sending that. Try again, or email Joel directly.";
  }
}

function wireAsk(){
  view.querySelectorAll('[data-ask] .askbtn').forEach(b =>
    b.onclick = () => openAsk(b.closest('[data-ask]')));
}

/* ---------- questions, on the admin side ---------- */
async function showQuestions(){
  document.body.classList.remove('present','editing');
  $('#presentBtn').hidden = true;
  view.innerHTML = loading('Looking for questions…');
  try {
    const { threads } = await api('/api/asks');
    const rows = threads.map(t => {
      const n = t.count, who = esc(t.clientName);
      const line = t.flagged
        ? `${t.flagged} of them worth a look before ${who.split(' ')[0]} emails you`
        : t.last ? `Latest: "${esc(t.last)}"` : '';
      return `<div class="qrow ${t.unseen?'unseen':''} ${t.flagged?'flag':''}"
          data-c="${esc(t.clientId)}" data-r="${esc(t.reportId)}">
        ${t.unseen?'<span class="dot"></span>':''}
        <span class="tile" style="width:38px;height:38px;border-radius:11px;font-size:12px">${esc(t.initials)}</span>
        <div class="m"><b>${who} had ${n} question${n===1?'':'s'} about the ${esc(t.reportTitle||'report')}</b>
          <span>${line}</span></div>
        ${t.flagged?`<span class="flagtag">${t.flagged} flagged</span>`:''}
      </div>`;
    }).join('');
    view.innerHTML = `<div class="list-h"><div><div class="eyebrow">Internal</div><h1>Questions from clients</h1></div></div>
      <p class="muted" style="margin-top:8px">Everything clients asked inside their reports. Flagged ones are the ones to read first.</p>
      <div class="qlist">${rows || `<div class="empty"><b>No questions yet</b>They'll appear here as soon as a client asks something in a report.</div>`}</div>`;
    view.querySelectorAll('.qrow').forEach(r => r.onclick = () => {
      location.hash = `#/questions/${encodeURIComponent(r.dataset.c)}/${encodeURIComponent(r.dataset.r)}`; });
  } catch(e){ view.innerHTML = `<div class="notice"><b>Couldn't load questions.</b> ${esc(e.message)}</div>`; }
}

async function showThread(cid, rid){
  view.innerHTML = loading('Opening…');
  try {
    const t = await api(`/api/asks/thread?c=${encodeURIComponent(cid)}&report=${encodeURIComponent(rid)}&seen=1`);
    const turns = t.entries.map(e => `<div class="turn">
      <div class="meta">${esc(new Date(e.at).toLocaleString())} · ${esc(e.section||'report')}${e.engine==='model'?' · ai':''}${e.flagged?' · <span class="flagtag">Flagged</span>':''}</div>
      <div class="qq">${esc(e.question)}</div>
      <div class="aa ${e.routed?'routed':''}">${esc(e.answer)}</div></div>`).join('');
    view.innerHTML = `<a class="back" href="#/questions">← All questions</a>
      <div class="list-h"><div><div class="eyebrow">${esc(t.clientName)}</div><h1>${esc(t.reportTitle||'Report')}</h1></div>
        <a class="tbtn" href="#/reports/${encodeURIComponent(cid)}/${encodeURIComponent(rid)}">Open the report</a></div>
      <div class="tr2">${turns}</div>`;
  } catch(e){ view.innerHTML = `<div class="notice"><b>Couldn't open that.</b> ${esc(e.message)}</div>`; }
}

/* ================= router ================= */
const HUB = window.HUB || { role:'admin' };
const IS_CLIENT = HUB.role === 'client';
if (IS_CLIENT){
  document.body.classList.add('client');
  document.querySelector('.brand').setAttribute('href', '#/c/' + encodeURIComponent(HUB.id));
  const nav = document.querySelector('.tabs');
  nav.classList.remove('admin');
  nav.innerHTML = `<a href="#/c/${encodeURIComponent(HUB.id)}" data-tab="dash">Dashboard</a><a href="#/reports" data-tab="reports">Reports</a>`;
}
function route(){
  const hs = location.hash;
  if (IS_CLIENT){
    const one = hs.match(/^#\/reports\/([\w-]+)/);
    if (one){ setTab('reports'); openReport(HUB.id, decodeURIComponent(one[1])); scrollTo(0,0); return; }
    if (hs.startsWith('#/reports')){ setTab('reports'); showReports(); scrollTo(0,0); return; }
    state.id = HUB.id; setTab('dash'); showReport(); scrollTo(0, 0); return;
  }
  const qt = hs.match(/^#\/questions(?:\/([\w-]+)\/([\w-]+))?/);
  if (qt){ setTab('questions'); qt[1] ? showThread(decodeURIComponent(qt[1]), decodeURIComponent(qt[2])) : showQuestions(); scrollTo(0,0); return; }
  const m  = hs.match(/^#\/c\/([\w-]+)/);
  const rp = hs.match(/^#\/reports(?:\/([\w-]+))?(?:\/([\w-]+))?/);
  const tab = rp ? 'reports' : (m || hs === '#/clients') ? 'clients' : 'dash';
  setTab(tab);
  if (rp){
    const cid = rp[1] ? decodeURIComponent(rp[1]) : null;
    const rid = rp[2] ? decodeURIComponent(rp[2]) : null;
    if (cid && rid === 'new') newReport(cid);
    else if (cid && rid) openReport(cid, rid);
    else showReports(cid);
  }
  else if (m){ state.id = decodeURIComponent(m[1]); showReport(); }
  else if (hs === '#/clients'){ state.id = null; showList(); }
  else { state.id = null; showDashboard(); }
  scrollTo(0, 0);
}
state.days = [7,28,90].includes(+store('hub-days')) ? +store('hub-days') : 28;
function setTab(t){ document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on', a.dataset.tab===t)); }
addEventListener('hashchange', route);

/* present mode */
$('#presentBtn').onclick = () => { document.body.classList.add('present'); scrollTo(0,0); };
$('#exitBtn').onclick = () => document.body.classList.remove('present');
addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('present'); });

/* theme */
const SUN = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 20 20"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"/></svg>';
function paintTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const b = $('#themeBtn');
  b.innerHTML = dark ? SUN + '<span>Light</span>' : MOON + '<span>Dark</span>';
  b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  store('hub-theme', dark ? 'dark' : 'light');
  paintTheme();
};
paintTheme();
route();
</script>
</body>
</html>
